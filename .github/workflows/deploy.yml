name: Deploy

on:
  push:
    branches: [main, test, staging, prod]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: birdzReact
    steps:
      - uses: actions/checkout@v4

      # birdzReact is a private submodule; fetch it over SSH with a
      # read-only deploy key so no expiring token is involved
      - name: Checkout birdzReact submodule
        working-directory: ${{ github.workspace }}
        env:
          SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/submodule_key
          chmod 600 ~/.ssh/submodule_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/submodule_key -o IdentitiesOnly=yes"
          git config --global url."git@github.com:jaredrbrick/".insteadOf "https://github.com/jaredrbrick/"
          git submodule update --init

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: birdzReact/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: birdzReact/dist/
          retention-days: 1

  deploy-dev:
    name: Deploy → dev
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch deploy config from SSM
        id: config
        run: |
          get() { aws ssm get-parameter --name "/birdz/dev/deploy/$1" --query Parameter.Value --output text; }
          echo "cf_distribution_id=$(get cf-distribution-id)" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(get cognito-user-pool-id)" >> "$GITHUB_OUTPUT"
          echo "client_id=$(get cognito-client-id)" >> "$GITHUB_OUTPUT"
          echo "identity_pool_id=$(get identity-pool-id)" >> "$GITHUB_OUTPUT"
          echo "game_data_table=$(get game-data-table)" >> "$GITHUB_OUTPUT"

      - name: Write runtime config
        run: |
          echo '{"userPoolId":"${{ steps.config.outputs.user_pool_id }}","clientId":"${{ steps.config.outputs.client_id }}","identityPoolId":"${{ steps.config.outputs.identity_pool_id }}","gameDataTable":"${{ steps.config.outputs.game_data_table }}","region":"us-east-1"}' > dist/config.json

      - name: Sync to S3
        run: aws s3 sync dist/ s3://birdz-dev-site --delete --exclude "audio/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.config.outputs.cf_distribution_id }} --paths "/*"

      - name: Smoke test
        run: curl -sf --retry 5 --retry-delay 10 https://dev.birdz.3569081.xyz/ -o /dev/null

  deploy-test:
    name: Deploy → test
    needs: build-and-test
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch deploy config from SSM
        id: config
        run: |
          get() { aws ssm get-parameter --name "/birdz/test/deploy/$1" --query Parameter.Value --output text; }
          echo "cf_distribution_id=$(get cf-distribution-id)" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(get cognito-user-pool-id)" >> "$GITHUB_OUTPUT"
          echo "client_id=$(get cognito-client-id)" >> "$GITHUB_OUTPUT"
          echo "identity_pool_id=$(get identity-pool-id)" >> "$GITHUB_OUTPUT"
          echo "game_data_table=$(get game-data-table)" >> "$GITHUB_OUTPUT"

      - name: Write runtime config
        run: |
          echo '{"userPoolId":"${{ steps.config.outputs.user_pool_id }}","clientId":"${{ steps.config.outputs.client_id }}","identityPoolId":"${{ steps.config.outputs.identity_pool_id }}","gameDataTable":"${{ steps.config.outputs.game_data_table }}","region":"us-east-1"}' > dist/config.json

      - name: Sync to S3
        run: aws s3 sync dist/ s3://birdz-test-site --delete --exclude "audio/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.config.outputs.cf_distribution_id }} --paths "/*"

      - name: Smoke test
        run: curl -sf --retry 5 --retry-delay 10 https://test.birdz.3569081.xyz/ -o /dev/null

  deploy-staging:
    name: Deploy → staging
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch deploy config from SSM
        id: config
        run: |
          get() { aws ssm get-parameter --name "/birdz/staging/deploy/$1" --query Parameter.Value --output text; }
          echo "cf_distribution_id=$(get cf-distribution-id)" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(get cognito-user-pool-id)" >> "$GITHUB_OUTPUT"
          echo "client_id=$(get cognito-client-id)" >> "$GITHUB_OUTPUT"
          echo "identity_pool_id=$(get identity-pool-id)" >> "$GITHUB_OUTPUT"
          echo "game_data_table=$(get game-data-table)" >> "$GITHUB_OUTPUT"

      - name: Write runtime config
        run: |
          echo '{"userPoolId":"${{ steps.config.outputs.user_pool_id }}","clientId":"${{ steps.config.outputs.client_id }}","identityPoolId":"${{ steps.config.outputs.identity_pool_id }}","gameDataTable":"${{ steps.config.outputs.game_data_table }}","region":"us-east-1"}' > dist/config.json

      - name: Sync to S3
        run: aws s3 sync dist/ s3://birdz-staging-site --delete --exclude "audio/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.config.outputs.cf_distribution_id }} --paths "/*"

      - name: Smoke test
        run: curl -sf --retry 5 --retry-delay 10 https://staging.birdz.3569081.xyz/ -o /dev/null

  deploy-prod:
    name: Deploy → prod
    needs: build-and-test
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: prod  # pauses for manual approval — configure required reviewers in GitHub repo settings
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch deploy config from SSM
        id: config
        run: |
          get() { aws ssm get-parameter --name "/birdz/prod/deploy/$1" --query Parameter.Value --output text; }
          echo "cf_distribution_id=$(get cf-distribution-id)" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(get cognito-user-pool-id)" >> "$GITHUB_OUTPUT"
          echo "client_id=$(get cognito-client-id)" >> "$GITHUB_OUTPUT"
          echo "identity_pool_id=$(get identity-pool-id)" >> "$GITHUB_OUTPUT"
          echo "game_data_table=$(get game-data-table)" >> "$GITHUB_OUTPUT"

      - name: Write runtime config
        run: |
          echo '{"userPoolId":"${{ steps.config.outputs.user_pool_id }}","clientId":"${{ steps.config.outputs.client_id }}","identityPoolId":"${{ steps.config.outputs.identity_pool_id }}","gameDataTable":"${{ steps.config.outputs.game_data_table }}","region":"us-east-1"}' > dist/config.json

      - name: Sync to S3
        run: aws s3 sync dist/ s3://birdz-prod-site --delete --exclude "audio/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.config.outputs.cf_distribution_id }} --paths "/*"

      - name: Smoke test
        run: curl -sf --retry 5 --retry-delay 10 https://birdz.3569081.xyz/ -o /dev/null
