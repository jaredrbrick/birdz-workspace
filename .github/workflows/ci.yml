name: CI

on:
  pull_request:
    branches: [main, test, staging, prod]

jobs:
  ci:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: birdzReact
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: birdzReact/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
